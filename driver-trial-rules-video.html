<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ड्राइवर्स साथी — 1-दिन ट्रायल नियम (Driver Trial Rules Reel)</title>
<link rel="icon" type="image/png" href="images/driver-saathi-logo-clean.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Noto+Sans+Devanagari:wght@600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --navy: #07101E;
    --gold: #FFB703;
    --marigold: #FB8500;
    --green: #10B981;
    --red: #EF4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: #020610;
    color: #fff;
    font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Full Screen Mobile 9:16 Reel Player Container */
  .reel-container {
    position: relative;
    width: 100%;
    height: 100%;
    height: 100dvh;
    max-width: min(100vw, calc(100dvh * 9 / 16));
    background: var(--navy);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
  }

  @media (min-width: 600px) {
    .reel-container {
      height: 94vh;
      max-height: 940px;
      border-radius: 24px;
      border: 1px solid rgba(255, 183, 3, 0.3);
    }
  }

  /* Canvas (Full HD 1080x1920 Internal Render Resolution) */
  canvas#reelCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  /* Interactive Story Overlay Layer */
  .story-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: env(safe-area-inset-top, 16px) 14px env(safe-area-inset-bottom, 16px);
    pointer-events: none;
  }

  /* Top Story Progress Segments */
  .progress-bar-wrap {
    display: flex;
    gap: 4px;
    width: 100%;
    padding-top: 8px;
    pointer-events: auto;
  }
  .progress-segment {
    flex: 1;
    height: 3.5px;
    background: rgba(255, 255, 255, 0.28);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: #FFB703;
    border-radius: 3px;
    transition: width 0.08s linear;
  }

  /* Top Header Elements */
  .story-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    pointer-events: auto;
  }
  .brand-badge {
    background: rgba(7, 16, 30, 0.75);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 183, 3, 0.4);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #FFB703;
  }
  .audio-btn {
    background: rgba(7, 16, 30, 0.75);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    color: #fff;
  }

  /* Touch Interaction Zones (Story Navigation) */
  .touch-zones {
    position: absolute;
    top: 60px; left: 0; right: 0; bottom: 85px;
    display: flex;
    z-index: 5;
    pointer-events: auto;
  }
  .zone-left { width: 30%; height: 100%; cursor: pointer; }
  .zone-mid { width: 40%; height: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .zone-right { width: 30%; height: 100%; cursor: pointer; }

  .pause-pill {
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(8px);
    padding: 10px 18px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }
  .touch-zones.is-paused .pause-pill {
    opacity: 1;
  }

  /* Bottom Floating Minimal Actions Bar */
  .story-bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    pointer-events: auto;
    z-index: 20;
    margin-bottom: 6px;
  }
  .btn-download-reel {
    flex: 1;
    background: linear-gradient(135deg, #FFB703 0%, #FB8500 100%);
    color: #07101E;
    border: none;
    padding: 11px 16px;
    border-radius: 26px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-shadow: 0 4px 16px rgba(251, 133, 0, 0.35);
  }
  .btn-download-reel:active { transform: scale(0.97); }

  .btn-mini-control {
    background: rgba(7, 16, 30, 0.8);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    padding: 11px 14px;
    border-radius: 26px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .rec-banner {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: #EF4444;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    padding: 4px 14px;
    border-radius: 20px;
    display: none;
    z-index: 50;
    animation: blink 1s infinite alternate;
  }
  @keyframes blink { from { opacity: 0.7; } to { opacity: 1; } }
</style>
</head>
<body>

  <!-- Reel Player Container (9:16 Full Screen Mobile Fit) -->
  <div class="reel-container" id="reelContainer">
    
    <!-- Ultra High-Definition Render Canvas -->
    <canvas id="reelCanvas" width="1080" height="1920"></canvas>

    <!-- Recording Indicator -->
    <div class="rec-banner" id="recBanner">🔴 रिकॉर्डिंग जारी है (Recording Reel...)</div>

    <!-- Interactive Touch Overlay Layer -->
    <div class="story-overlay">
      
      <!-- Top Progress Bars -->
      <div>
        <div class="progress-bar-wrap" id="progressBarWrap"></div>
        <div class="story-top-row">
          <div class="brand-badge" id="sceneBadge">नियम 1 / 6</div>
          <button type="button" class="audio-btn" id="audioToggleBtn" title="आवाज़ चालू/बंद (Mute/Unmute)">🔊</button>
        </div>
      </div>

      <!-- Touch Zones (Tap Left: Prev, Tap Right: Next, Tap Mid: Pause) -->
      <div class="touch-zones" id="touchZones">
        <div class="zone-left" id="zoneLeft" title="पिछला नियम"></div>
        <div class="zone-mid" id="zoneMid" title="रोकें / चलाएं">
          <div class="pause-pill" id="pausePill">❚❚ रुका हुआ (Tap to Play)</div>
        </div>
        <div class="zone-right" id="zoneRight" title="अगला नियम"></div>
      </div>

      <!-- Bottom Floating Minimal Controls -->
      <div class="story-bottom-bar">
        <button type="button" class="btn-download-reel" id="btnDownload">
          <span>🎬</span> रील डाउनलोड (Download Video)
        </button>
        <button type="button" class="btn-mini-control" id="btnRestart">↺ रीसेट</button>
      </div>

    </div>

  </div>

<script>
/**
 * DRIVERS SAATHI — REELS ENGINE v2.0 (CLEAN, MINIMAL, MALE VOICE, TRUE LOGO RATIO)
 */
(function() {
  const canvas = document.getElementById('reelCanvas');
  const ctx = canvas.getContext('2d');

  // Minimal, Punchy 6 Rules (No cluttered paragraphs, no 800, no shaam 7 baje)
  const SCENES = [
    {
      ruleNum: "नियम 1",
      title: "ड्रेसिंग व स्वच्छता",
      points: [
        "साफ़ कपड़े व जूते पहनें (चप्पल सख्त मना)",
        "मुँह में गुटखा, पान या सिगरेट बिल्कुल नहीं"
      ],
      bgImage: "images/driver_team_standing.jpg",
      speechText: "नियम एक: साफ़ कपड़े और जूते पहनें। चप्पल पहनना और मुँह में गुटखा या पान रखना सख्त मना है।",
      duration: 12000 // 12 seconds
    },
    {
      ruleNum: "नियम 2",
      title: "समय की पाबंदी",
      points: [
        "तय समय से 15 मिनट पहले पहुँचें",
        "पहुँचकर आदर से मालिक को सूचित करें"
      ],
      bgImage: "images/indian_driver_portrait.jpg",
      speechText: "नियम दो: तय समय से पंद्रह मिनट पहले पहुँचें और आदर से कार मालिक को सूचित करें।",
      duration: 12000
    },
    {
      ruleNum: "नियम 3",
      title: "कार की जाँच व सफ़ाई",
      points: [
        "बैठने से पहले कार की डस्टिंग व शीशे साफ़ करें",
        "टायर प्रेशर, फ्यूल और डैशबोर्ड चेक करें"
      ],
      bgImage: "images/indian_driver_wheel.jpg",
      speechText: "नियम तीन: बैठने से पहले कार की बाहर और अंदर की सफ़ाई करें, शीशे साफ़ करें और टायर व फ्यूल चेक करें।",
      duration: 13000
    },
    {
      ruleNum: "नियम 4",
      title: "शालीन व्यवहार",
      points: [
        "परिवार से केवल 'सर' या 'मैडम' कहकर बात करें",
        "ड्राइविंग के दौरान फ़ोन का इस्तेमाल सख्त मना"
      ],
      bgImage: "images/driver_passenger_service.jpg",
      speechText: "नियम चार: केवल सर या मैडम कहकर बात करें। ड्राइविंग के दौरान फ़ोन का इस्तेमाल बंद रखें।",
      duration: 12000
    },
    {
      ruleNum: "नियम 5",
      title: "सुरक्षित ड्राइविंग",
      points: [
        "सीटबेल्ट अनिवार्य • स्पीड लिमिट का पालन करें",
        "शांत ड्राइविंग — नो रश, नो अचानक ब्रेक"
      ],
      bgImage: "images/fleet_cabs_delhi.jpg",
      speechText: "नियम पांच: सीटबेल्ट अनिवार्य है। स्पीड लिमिट में रहें और शांत ड्राइविंग करें।",
      duration: 12000
    },
    {
      ruleNum: "नियम 6",
      title: "ट्रायल मानदेय व नियम",
      points: [
        "ट्रायल मानदेय सीधे आपके बैंक खाते / UPI पर",
        "मालिक से सीधी डील सख्त मना (लाइसेंस ब्लैकलिस्ट)"
      ],
      bgImage: "images/driver_verification_assessment.jpg",
      speechText: "नियम छह: ट्रायल मानदेय सीधे आपके खाते में भेजा जाएगा। मालिक से सीधी डील की सख्त मनाही है।",
      duration: 13000
    }
  ];

  // Preload Logo & Backgrounds
  const logoImg = new Image();
  logoImg.src = "images/driver-saathi-logo-clean.png";

  const preloadedImgs = {};
  SCENES.forEach((sc, i) => {
    const im = new Image();
    im.src = sc.bgImage;
    preloadedImgs[i] = im;
  });

  // State
  let currentSceneIndex = 0;
  let sceneStartTime = performance.now();
  let isPlaying = true;
  let audioEnabled = true;
  let animId = null;

  // Build Top Progress Bars
  const progressWrap = document.getElementById('progressBarWrap');
  progressWrap.innerHTML = '';
  SCENES.forEach((_, idx) => {
    const seg = document.createElement('div');
    seg.className = 'progress-segment';
    const fill = document.createElement('div');
    fill.className = 'progress-fill';
    fill.id = 'fill_' + idx;
    seg.appendChild(fill);
    progressWrap.appendChild(seg);
  });

  // Deep Male Voice Selection (Web Speech API)
  function getMaleVoice() {
    if (!window.speechSynthesis) return null;
    const voices = window.speechSynthesis.getVoices();
    // Prioritize Indian English / Hindi male voices
    const inVoices = voices.filter(v => v.lang.includes('hi') || v.lang.includes('IN') || v.lang.includes('en-IN'));
    const male = inVoices.find(v => {
      const n = v.name.toLowerCase();
      return n.includes('male') || n.includes('madhav') || n.includes('hemant') || n.includes('ravi') || n.includes('google hindi');
    }) || inVoices[0] || voices[0];
    return male;
  }

  function speakCurrentScene() {
    if (!audioEnabled || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const scene = SCENES[currentSceneIndex];
    const utt = new SpeechSynthesisUtterance(scene.speechText);
    utt.lang = 'hi-IN';
    utt.pitch = 0.80; // Deep authoritative male pitch
    utt.rate = 0.92;  // Clear, confident pace
    const mVoice = getMaleVoice();
    if (mVoice) utt.voice = mVoice;
    window.speechSynthesis.speak(utt);
  }

  if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = () => {};
  }

  function goToScene(idx) {
    if (idx < 0) idx = 0;
    if (idx >= SCENES.length) idx = 0; // Loop seamlessly
    currentSceneIndex = idx;
    sceneStartTime = performance.now();
    document.getElementById('sceneBadge').innerText = `नियम ${currentSceneIndex + 1} / ${SCENES.length}`;

    // Update progress fills
    for (let i = 0; i < SCENES.length; i++) {
      const f = document.getElementById('fill_' + i);
      if (f) {
        if (i < currentSceneIndex) f.style.width = '100%';
        else if (i > currentSceneIndex) f.style.width = '0%';
      }
    }
    speakCurrentScene();
  }

  // Draw High-Definition 1080x1920 Frame
  function renderFrame(now) {
    const scene = SCENES[currentSceneIndex];
    const elapsed = now - sceneStartTime;
    const progress = Math.min(elapsed / scene.duration, 1.0);

    const activeFill = document.getElementById('fill_' + currentSceneIndex);
    if (activeFill) {
      activeFill.style.width = (progress * 100) + '%';
    }

    if (progress >= 1.0 && isPlaying) {
      goToScene(currentSceneIndex + 1);
      animId = requestAnimationFrame(renderFrame);
      return;
    }

    // 1. Background Fill & Subtle Cinematic Zoom
    ctx.fillStyle = '#07101E';
    ctx.fillRect(0, 0, 1080, 1920);

    const bg = preloadedImgs[currentSceneIndex];
    if (bg && bg.complete && bg.naturalWidth > 0) {
      ctx.save();
      const zoom = 1.0 + (progress * 0.06);
      ctx.translate(540, 960);
      ctx.scale(zoom, zoom);
      ctx.translate(-540, -960);

      const scale = Math.max(1080 / bg.width, 1920 / bg.height);
      const w = bg.width * scale;
      const h = bg.height * scale;
      const x = (1080 - w) / 2;
      const y = (1920 - h) / 2;
      ctx.drawImage(bg, x, y, w, h);
      ctx.restore();
    }

    // 2. Sleek Dark Gradient Overlay (Cinematic contrast)
    const grad = ctx.createLinearGradient(0, 0, 0, 1920);
    grad.addColorStop(0, 'rgba(7, 16, 30, 0.90)');
    grad.addColorStop(0.30, 'rgba(7, 16, 30, 0.70)');
    grad.addColorStop(0.70, 'rgba(7, 16, 30, 0.88)');
    grad.addColorStop(1, 'rgba(7, 16, 30, 0.98)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1080, 1920);

    // 3. Top Branding Header (PRESERVE EXACT LOGO NATURAL ASPECT RATIO!)
    ctx.save();
    if (logoImg.complete && logoImg.naturalWidth > 0) {
      // Natural ratio: width 980, height 848 (approx 1.15 : 1)
      const targetH = 95;
      const targetW = targetH * (logoImg.naturalWidth / logoImg.naturalHeight); // ~110px, perfectly proportional!
      ctx.drawImage(logoImg, 70, 180, targetW, targetH);

      // Text Brand Next to Logo
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 42px Montserrat';
      ctx.fillText('DRIVERS SAATHI', 70 + targetW + 24, 235);

      ctx.fillStyle = '#FFB703';
      ctx.font = '700 22px Montserrat';
      ctx.fillText('1-DAY TRIAL TRAINING', 70 + targetW + 26, 268);
    } else {
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 46px Montserrat';
      ctx.fillText('DRIVERS SAATHI', 70, 240);
    }
    ctx.restore();

    // 4. Rule Tag Pill (e.g. "नियम 1")
    ctx.save();
    ctx.fillStyle = '#FB8500';
    ctx.beginPath();
    ctx.roundRect(70, 420, 180, 56, 28);
    ctx.fill();

    ctx.fillStyle = '#07101E';
    ctx.font = '800 30px "Noto Sans Devanagari"';
    ctx.textAlign = 'center';
    ctx.fillText(scene.ruleNum, 160, 458);
    ctx.restore();

    // 5. Main Title (Clean, Bold, Minimal)
    ctx.save();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 68px "Noto Sans Devanagari"';
    ctx.textAlign = 'left';
    ctx.fillText(scene.title, 70, 555);

    // Subtle Gold Accent Line Under Title
    ctx.fillStyle = '#FFB703';
    ctx.fillRect(70, 585, 120, 6);
    ctx.restore();

    // 6. Minimal Bullet Points (Spaced, Clean, Legible in 2 seconds)
    ctx.save();
    let pointY = 740;
    scene.points.forEach((pt, pIdx) => {
      const delay = pIdx * 0.25;
      const alpha = Math.min(Math.max((progress - delay) / 0.15, 0), 1.0);

      ctx.save();
      ctx.globalAlpha = alpha;

      // Card Container for each point
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.beginPath();
      ctx.roundRect(70, pointY - 60, 940, 160, 24);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 183, 3, 0.35)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Golden Tick Icon
      ctx.fillStyle = '#FFB703';
      ctx.beginPath();
      ctx.arc(130, pointY + 20, 24, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#07101E';
      ctx.font = '800 26px Montserrat';
      ctx.textAlign = 'center';
      ctx.fillText('✓', 130, pointY + 29);

      // Clean Text
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 36px "Noto Sans Devanagari"';
      ctx.textAlign = 'left';
      ctx.fillText(pt, 180, pointY + 32);

      pointY += 210;
      ctx.restore();
    });
    ctx.restore();

    // 7. Minimal Bottom Trust Bar (Clean, uncluttered, no 800 or 7 baje)
    ctx.save();
    const bottomY = 1580;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.90)';
    ctx.beginPath();
    ctx.roundRect(70, bottomY, 940, 180, 24);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#10B981';
    ctx.font = '800 30px "Noto Sans Devanagari"';
    ctx.textAlign = 'center';
    ctx.fillText('100% फ्री ड्राइवर भर्ती • कोई दलाली या कमीशन नहीं', 540, bottomY + 65);

    ctx.fillStyle = '#FFB703';
    ctx.font = '800 34px Montserrat';
    ctx.fillText('📞 +91 8175087004  •  driverssaathi.com', 540, bottomY + 125);
    ctx.restore();

    if (isPlaying) {
      animId = requestAnimationFrame(renderFrame);
    }
  }

  // Story Tap Navigation (Left: Prev, Right: Next, Mid: Pause/Play)
  const touchZones = document.getElementById('touchZones');
  const pausePill = document.getElementById('pausePill');

  document.getElementById('zoneLeft').addEventListener('click', (e) => {
    e.stopPropagation();
    goToScene(currentSceneIndex - 1);
  });

  document.getElementById('zoneRight').addEventListener('click', (e) => {
    e.stopPropagation();
    goToScene(currentSceneIndex + 1);
  });

  document.getElementById('zoneMid').addEventListener('click', (e) => {
    e.stopPropagation();
    isPlaying = !isPlaying;
    if (isPlaying) {
      touchZones.classList.remove('is-paused');
      sceneStartTime = performance.now();
      animId = requestAnimationFrame(renderFrame);
      speakCurrentScene();
    } else {
      touchZones.classList.add('is-paused');
      if (animId) cancelAnimationFrame(animId);
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }
  });

  document.getElementById('btnRestart').addEventListener('click', () => {
    goToScene(0);
  });

  // Audio Toggle
  const audioBtn = document.getElementById('audioToggleBtn');
  audioBtn.addEventListener('click', () => {
    audioEnabled = !audioEnabled;
    audioBtn.innerText = audioEnabled ? '🔊' : '🔇';
    if (!audioEnabled && window.speechSynthesis) {
      window.speechSynthesis.cancel();
    } else {
      speakCurrentScene();
    }
  });

  // Start Playback
  goToScene(0);
  animId = requestAnimationFrame(renderFrame);

  // 1-Click HD Reel Video Downloader (MediaRecorder Stream)
  const btnDownload = document.getElementById('btnDownload');
  const recBanner = document.getElementById('recBanner');

  btnDownload.addEventListener('click', () => {
    if (!window.MediaRecorder) {
      alert("MediaRecorder आपके ब्राउज़र में उपलब्ध नहीं है।");
      return;
    }

    btnDownload.disabled = true;
    recBanner.style.display = 'block';
    btnDownload.innerText = '⏳ वीडियो तैयार हो रहा है...';

    goToScene(0);

    const stream = canvas.captureStream(30);
    const mimeTypes = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm'];
    let selMime = 'video/webm';
    for (let m of mimeTypes) {
      if (MediaRecorder.isTypeSupported(m)) {
        selMime = m;
        break;
      }
    }

    const mr = new MediaRecorder(stream, {
      mimeType: selMime,
      videoBitsPerSecond: 6000000 // 6 Mbps High Definition 1080p
    });

    const chunks = [];
    mr.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) chunks.push(e.data);
    };

    mr.onstop = () => {
      recBanner.style.display = 'none';
      btnDownload.disabled = false;
      btnDownload.innerHTML = '<span>🎬</span> रील डाउनलोड (Download Video)';

      const blob = new Blob(chunks, { type: selMime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const ext = selMime.includes('mp4') ? 'mp4' : 'webm';
      a.download = `Drivers_Saathi_Trial_Reel_${Date.now()}.${ext}`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 100);
    };

    const totalDur = SCENES.reduce((s, sc) => s + sc.duration, 0);
    mr.start();

    setTimeout(() => {
      if (mr.state === 'recording') mr.stop();
    }, totalDur + 800);
  });

})();
</script>
</body>
</html>
